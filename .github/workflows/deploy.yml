name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build (static preset)
        run: bun run build
        env:
          NITRO_PRESET: static
          VITE_BASE_PATH: /ColossoDigital/

      - name: Show full build output tree (debug)
        run: find . \( -path ./node_modules -o -path ./.git \) -prune -o -name '*.html' -print 2>/dev/null; echo '---'; ls -la dist/ 2>/dev/null || echo 'no dist/'; ls -la .output/ 2>/dev/null || echo 'no .output/'

      - name: Copy 404.html for SPA fallback
        run: |
          OUT=$(find . \( -path ./node_modules -o -path ./.git \) -prune -o -name 'index.html' -print 2>/dev/null | head -1 | xargs dirname)
          echo "Detected output dir: $OUT"
          cp "$OUT/index.html" "$OUT/404.html"
          echo "PAGES_DIR=$OUT" >> $GITHUB_ENV

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
